# ISA Phase 0.3 — isa-provenance-hash-gate
# Patterned on shader-grammar validate: checkout, node 22, recompute hashes,
# Socratic diagnostic on failure. Contract semantics: docs/PHASE-0.3-ISA-CONTRACT.md §CI.
name: isa-provenance-hash-gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  provenance-hash-gate:
    name: Provenance hash gate (fail closed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
      # Collect every provenance receipt hash; recompute from bytes; fail closed on
      # missing or mismatched hashes. On failure the script runs
      # socratic-hash-diagnostic and writes diagnostic.md (Q1–Q7); the step exits non-zero.
      - name: Recompute provenance hashes from bytes
        run: node scripts/isa-provenance-hash-gate.mjs
      - name: Upload socratic-hash-diagnostic
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: socratic-hash-diagnostic
          path: diagnostic.md
          if-no-files-found: warn

  fixture-gates:
    name: Fixture gates F01–F14 (lexicon F09–F14)
    runs-on: ubuntu-latest
    needs: provenance-hash-gate
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
      - name: Fixture gates F01–F14 incl. lexicon F09–F14
        run: node scripts/run-fixture-gates.mjs
        env:
          ISA_FIXTURE_MODE: declare

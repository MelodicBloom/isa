# Thin pointer — GitHub Actions only auto-runs under .github/workflows/.
# Canonical job contract: /isa-provenance-hash-gate.yml at repository ROOT.
name: isa-ci
on:
  push:
  pull_request:
jobs:
  provenance-hash-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
      - name: Recompute hashes (fail closed)
        run: node scripts/isa-provenance-hash-gate.mjs
      - name: Upload Socratic diagnostic on failure
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: socratic-hash-diagnostic
          path: diagnostic.md
          if-no-files-found: ignore
  fixture-gates:
    runs-on: ubuntu-latest
    needs: provenance-hash-gate
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
      - name: Declare F01–F14 / F09–F14 lexicon fixtures
        run: node scripts/run-fixture-gates.mjs
        env:
          ISA_FIXTURE_MODE: declare
